<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影视资源库</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
header{padding:24px 18px;border-bottom:1px solid #29292e}
h1{margin:0;color:#ffc22b;font-size:25px}
header p{color:#aaa;font-size:14px}
main{max-width:720px;margin:24px auto;padding:0 16px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #393940;background:#19191e;color:white;font-size:16px;margin-bottom:18px}
.item{padding:18px;margin-bottom:12px;border:1px solid #33333a;border-radius:14px;background:#151519}
.item h2{font-size:18px;margin:0 0 12px}
.item a{display:inline-block;color:#17120a;background:#ffc22b;padding:10px 16px;border-radius:9px;text-decoration:none;font-weight:bold}
.note{color:#999;font-size:14px}
</style>
</head>
<body>
<header>
<h1>🎬 影视资源库</h1>
<p>电影 · 电视剧 · 动漫 · 夸克网盘分享</p>
</header>
<main>
<input id="search" placeholder="搜索影视名称">
<p id="status" class="note">正在加载影视资源……</p>
<div id="list"></div>
</main>
<script>
const SUPABASE_URL = "https://zmfqjmspsrqcjtybxxfr.supabase.co";
const SUPABASE_KEY = "sb_publishable_T16XJ_-93_hkHYfy81gL6A_hvPM-NoU";
let movies = [];

async function loadMovies(){
  const status = document.getElementById("status");
  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/movies?select=title,category,release_year,quark_url&order=created_at.desc",
      {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}}
    );
    if(!response.ok) throw new Error("读取失败："+response.status);
    movies = await response.json();
    status.textContent = movies.length ? "共 "+movies.length+" 部影视资源" : "暂时还没有影视资源";
    render();
  } catch(error) {
    status.textContent = "加载失败，请检查数据库公开读取权限。";
  }
}

function render(){
  const keyword = document.getElementById("search").value.trim().toLowerCase();
  const list = document.getElementById("list");
  list.replaceChildren();
  const results = movies.filter(m => (m.title || "").toLowerCase().includes(keyword));
  if(!results.length){
    list.textContent = "没有找到相关影视";
    return;
  }
  results.forEach(m => {
    const card = document.createElement("section");
    card.className = "item";
    const title = document.createElement("h2");
    title.textContent = m.title || "未命名资源";
    card.appendChild(title);
    const info = document.createElement("p");
    info.className = "note";
    info.textContent = [m.category,m.release_year].filter(Boolean).join(" · ");
    card.appendChild(info);
    if(m.quark_url){
      const link = document.createElement("a");
      link.textContent = "打开夸克网盘";
      link.href = m.quark_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      card.appendChild(link);
    }
    list.appendChild(card);
  });
}

document.getElementById("search").addEventListener("input",render);
loadMovies();
</script>
</body>
</html>
